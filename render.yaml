# Render Blueprint for the public demo (fictitious data only).
# The demo admin password is generated by Render; see it in the dashboard
# under Environment > CCDR_DEMO_ADMIN_PASSWORD.
services:
  - type: web
    name: ccdr-heredia-demo
    runtime: python
    plan: free
    region: ohio
    branch: main
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /api/public/facilities
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HOST
        value: 0.0.0.0
      - key: CCDR_DEMO_MODE
        value: "true"
      - key: CCDR_SECURE_COOKIES
        value: "true"
      - key: CCDR_TRUST_PROXY
        value: "true"
      - key: CCDR_ACCESS_LOG
        value: "false"
      - key: CCDR_DEMO_ADMIN_PASSWORD
        generateValue: true
